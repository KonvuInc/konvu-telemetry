[metadata]
name = konvu-telemetry
version = 1.0.3
description = Local-first live usage monitoring for Claude Code and Codex
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Konvu
url = https://github.com/KonvuInc/konvu-telemetry
project_urls =
    Documentation = https://github.com/KonvuInc/konvu-telemetry#readme
    Issues = https://github.com/KonvuInc/konvu-telemetry/issues
    Security = https://github.com/KonvuInc/konvu-telemetry/security/policy
license_files =
    LICENSE
    NOTICE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Operating System :: MacOS

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.12
include_package_data = False
install_requires =
    tiktoken==0.14.0
    ctok==1.3.0
    regex==2026.9.29
    requests==2.34.2
    certifi==2026.7.22
    charset-normalizer==3.5.2
    idna==3.20
    urllib3==2.8.0

[options.packages.find]
where = src

[options.package_data]
konvu_telemetry =
    dashboard/*
    pricing.json

[options.entry_points]
console_scripts =
    konvu-telemetry = konvu_telemetry.cli:main

[mypy]
python_version = 3.12
strict = True
