name: Bug report
description: Report a reproducible local collector, dashboard, or integration problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include prompts, transcripts, API keys, source code, or private local paths.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Unsupported platform
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - Claude Code
        - Codex CLI
        - Dashboard or installer
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include reproduction steps and sanitized output from `konvu-telemetry status`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
