name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check mypy==1.18.2 ruff==0.15.6
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy src/konvu_telemetry
      - run: python -m compileall -q src
      - run: node --check src/konvu_telemetry/dashboard/fleet.js
      - run: python -m pip install --disable-pip-version-check .
      - run: python -m unittest discover -s tests -v

  release:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: git fetch origin main
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: test "${GITHUB_REF_NAME#v}" = "$(python -c 'import configparser; config=configparser.ConfigParser(); config.read("setup.cfg"); print(config["metadata"]["version"])')"
      - run: python -m pip install --disable-pip-version-check build==1.3.0
      - run: python -m build --sdist --wheel --outdir dist
      - run: cd dist && shasum -a 256 *.whl *.tar.gz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
