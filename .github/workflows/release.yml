name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check mypy==1.18.2 ruff==0.15.6
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy src/konvu_telemetry
      - run: python -m compileall -q src
      - run: node --check src/konvu_telemetry/dashboard/fleet.js
      - run: python -m pip install --disable-pip-version-check .
      - run: python -m unittest discover -s tests -v

  release:
    needs: test
    if: github.ref_protected
    environment: release
    runs-on: macos-15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: git fetch origin main
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: test "${GITHUB_REF_NAME#v}" = "$(python -c 'import configparser; config=configparser.ConfigParser(); config.read("setup.cfg"); print(config["metadata"]["version"])')"
      - run: python -m pip install --disable-pip-version-check build==1.3.0
      - run: python -m build --sdist --wheel --outdir dist
      - run: cd dist && shasum -a 256 *.whl *.tar.gz > SHA256SUMS
      - name: Smoke-test release artifacts
        run: |
          python -m venv /tmp/konvu-release-wheel
          /tmp/konvu-release-wheel/bin/pip install --no-deps dist/*.whl
          /tmp/konvu-release-wheel/bin/python -c 'from importlib.resources import files; root = files("konvu_telemetry"); assert root.joinpath("pricing.json").is_file(); assert root.joinpath("dashboard/index.html").is_file()'
          python -m venv /tmp/konvu-release-sdist
          /tmp/konvu-release-sdist/bin/pip install --no-deps dist/*.tar.gz
          /tmp/konvu-release-sdist/bin/konvu-telemetry --help
          /tmp/konvu-release-wheel/bin/konvu-telemetry serve --port 17824 --interval 1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..10}; do
            if curl --silent --fail http://127.0.0.1:17824/healthz | grep -q '"status": "healthy"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
